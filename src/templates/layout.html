<!doctype html>
<html lang="az" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0d13">
<link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{root}}assets/css/fonts.css">
<link rel="stylesheet" href="{{root}}assets/css/main.css">
<script>
  document.documentElement.classList.replace("no-js", "js");
  try { if (localStorage.getItem("qrup596:motion") === "off") document.documentElement.dataset.motion = "off"; } catch (e) {}
</script>
{{extra_head}}
</head>
<body class="{{page_class}}">
<a class="skip" href="#main">Məzmuna keç</a>
<div class="grain" aria-hidden="true"></div>
{{header}}
<main id="main">
{{body}}
</main>
{{footer}}
<div class="search" data-search hidden>
  <div class="search-backdrop" data-search-close></div>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Axtar">
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="text" placeholder="Fənn, dərs və ya başlıq axtar…" autocomplete="off" spellcheck="false" data-search-input>
      <kbd>Esc</kbd>
    </div>
    <ul class="search-results" data-search-results></ul>
    <div class="search-foot"><span><kbd>↑</kbd><kbd>↓</kbd> seç</span><span><kbd>Enter</kbd> aç</span></div>
  </div>
</div>
<div class="toast" data-toast aria-live="polite"></div>
<script>window.Q596_ROOT = "{{root}}";</script>
<script src="{{root}}assets/js/data.js"></script>
<script src="{{root}}assets/js/main.js"></script>
</body>
</html>
